name: quantum_crypto
description: "An advanced, Post-Quantum Cryptography suite for Flutter, powered by Rust."
version: 0.0.1

repository: https://github.com/MostafaSensei106/Quantum-Crypto
license: GPL-version 3.0

topics:
- ffi
- mlkem
- mldsa
- crypto
- rust

funding:
- https://github.com/sponsors/MostafaSensei106
- https://buymeacoffee.com/7yz1lqkegy
- https://ipn.eg/S/mostafasensei106/instapay/0dlUfz

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: '>=3.3.0'

dependencies:
  flutter_rust_bridge: 2.12.0

dev_dependencies:
  ffi: ^2.1.3
  ffigen: ^21.0.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter
  benchmark_harness: ^2.4.0

flutter:

  plugin:
    platforms:
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: true
      linux:
        ffiPlugin: true
      macos:
        ffiPlugin: true
      windows:
        ffiPlugin: true
