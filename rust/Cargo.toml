[package]
name = "quantum_crypto"
version = "0.0.3"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
pqcrypto-mldsa = { version = "0.1.2", default-features = false, features = ["std"] }
pqcrypto-mlkem = "0.1.1"
pqcrypto-sphincsplus = "0.7"
pqcrypto-traits = "0.3.5"
zeroize = { version = "1.9.0", features = ["zeroize_derive"] }
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
subtle = "2.6"
hkdf = "0.12"
sha2 = "0.10"
sha3 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
aead = { version = "0.5", features = ["stream"] }
aes-gcm = { version = "0.10", features = ["zeroize"] }
chacha20poly1305 = "0.11"
base64 = "0.22"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }


[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
strip = "symbols"

[dev-dependencies]
proptest = "1.12"
