[package]
name = "quantum_crypto"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.12.0"
pqcrypto-mlkem = "0.1.1"
pqcrypto-traits = "0.3.5"
zeroize = { version = "1.9.0", features = ["zeroize_derive"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }


[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
